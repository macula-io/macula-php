name: CI

on:
  # A tag IS the release: a Composer package publishes by being tagged, so the
  # suite, and the dependency scan below, run on the tagged commit too. What
  # that buys is a detection, not a refusal: Packagist serves the tag the
  # moment it is pushed. The gate is the same scan on main before the tag.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # A branch tip has to be able to prove itself before it is reviewed: without
  # this, the only way to get CI onto a branch is a pull request.
  workflow_dispatch:

jobs:
  php-test:
    name: php (lint, composer validate, phpunit against in-process stations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
      - run: composer validate --strict
      - run: |
          for f in $(find src tests examples -name '*.php'); do
            php -l "$f"
          done
      - run: composer install --no-interaction --prefer-dist
      # The structural floor (macula-codebase-checks#9): phpcs holds the nesting
      # cap, phpmd the cyclomatic cap, both spelled out in their config rather
      # than left at a default. Named here one line each, the same two commands
      # composer lint runs, so the sweep can see what gates this repository.
      - run: vendor/bin/phpcs --standard=phpcs.xml
      - run: vendor/bin/phpmd src,tests,examples text phpmd.xml
      # The released libmacula for abi/MACULA_GO_REF, checked against its
      # SHA256SUMS and attestation, and macula-go's teststation at that tag:
      # two in-process stations the offline suite runs against. tests/live
      # dials the real fleet and never runs here: `composer test:live`, by hand.
      - run: composer build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: vendor/bin/phpunit

  # The Erlang cross-verifier in scripts/cross-verify-macula, held to the
  # structural floor (macula-codebase-checks#9): nesting 2, no nested
  # try/catch, no if, functions at most 60 lines. In the house build image,
  # since macula's NIFs build from source.
  erlang-helper-lint:
    name: Lint scripts/cross-verify-macula (structural floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: rebar3 as lint lint
        working-directory: scripts/cross-verify-macula
        run: rebar3 as lint lint

  # Every PHP block README.md publishes parses and type-checks against this
  # package, and a doc change runs this (macula-codebase-checks#8). The pin is a
  # full commit SHA. Packagist publishes by the tag alone, so there is no publish
  # job here to wait on it.
  docs:
    name: docs (PHP snippets)
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/doc-snippets-php.yml@d25a36c1b6ba7b8e72db17873aa7c2c7793eba70

  # A dependency with a published advisory fails the build
  # (macula-codebase-checks#11). This repository commits no lock, so the one
  # `composer install` writes is what is scanned, require-dev included: a
  # developer tool runs inside this job with the repository's credentials.
  #
  # WHERE THE GATE ACTUALLY IS: Packagist serves a tag the moment it is pushed,
  # so nothing here can refuse the release. The gate is this scan on main
  # before the tag is cut. The push trigger names tags so the scan runs on the
  # tagged commit too, and a red run there is a detection to act on, not a
  # refusal. Do not describe it as one.
  advisories:
    name: Dependency advisories
    permissions:
      contents: read
    uses: macula-io/macula-ci-images/.github/workflows/dependency-advisories.yml@83a76a358456bf2f7d6c919ad5e8fe7fd2162ce3
    with:
      ecosystem: php
      php-version: '8.3'
