name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-test:
    name: php (lint, composer validate, phpunit against in-process stations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
      - run: composer validate --strict
      - run: |
          for f in $(find src tests examples -name '*.php'); do
            php -l "$f"
          done
      - run: composer install --no-interaction --prefer-dist
      # The released libmacula for abi/MACULA_GO_REF, checked against its
      # SHA256SUMS and attestation, and macula-go's teststation at that tag:
      # two in-process stations the offline suite runs against. tests/live
      # dials the real fleet and never runs here: `composer test:live`, by hand.
      - run: composer build
        env:
          GH_TOKEN: ${{ github.token }}
      - run: vendor/bin/phpunit

  # The Erlang cross-verifier in scripts/cross-verify-macula, held to the
  # structural floor (macula-codebase-checks#9): nesting 2, no nested
  # try/catch, no if, functions at most 60 lines. In the house build image,
  # since macula's NIFs build from source.
  erlang-helper-lint:
    name: Lint scripts/cross-verify-macula (structural floor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1444@sha256:dd2ba6eb858a0eacedf0179300323fe5c6da46fb308d22da0ca8cfcd1f0718dc
    steps:
      - uses: actions/checkout@v4
      - name: rebar3 as lint lint
        working-directory: scripts/cross-verify-macula
        run: rebar3 as lint lint
