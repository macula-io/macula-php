name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-fmt-vet-build:
    name: cabi (gofmt, go vet, go test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cabi/go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build -buildmode=c-shared -o libmacula.so .

  php-test:
    name: php (lint, composer validate, phpunit against in-process stations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cabi/go.mod
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: ffi
      - run: composer validate --strict
      - run: |
          for f in $(find src tests examples -name '*.php'); do
            php -l "$f"
          done
      - run: composer install --no-interaction --prefer-dist
      # libmacula.so and build/teststation, two in-process macula 12
      # stations the offline suite runs against. tests/live dials the real
      # fleet and never runs here: `composer test:live`, by hand.
      - run: composer build
      - run: vendor/bin/phpunit
